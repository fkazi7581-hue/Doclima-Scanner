name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Create Android files if missing
      run: flutter create . --platforms=android --org com.example

    - name: Fix Android SDK Versions
      run: |
        GRADLE_PATH="android/app/build.gradle"
        if [ -f "$GRADLE_PATH" ]; then
          echo "android { compileSdkVersion 34 default { targetSdkVersion 34 minSdk 21 } }" >> $GRADLE_PATH
        fi
        
        KTS_PATH="android/app/build.gradle.kts"
        if [ -f "$KTS_PATH" ]; then
          echo "android { compileSdk = 34 default { targetSdk = 34 minSdk = 21 } }" >> $KTS_PATH
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: doclima-scanner-apk
        path: build/app/outputs/flutter-apk/app-release.apk
