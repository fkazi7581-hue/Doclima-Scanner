name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Create Android files if missing
      run: flutter create . --platforms=android --org com.example

    - name: Force Android SDK 34
      run: |
        GRADLE_FILE="android/app/build.gradle"
        if [ -f "$GRADLE_FILE" ]; then
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' $GRADLE_FILE
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' $GRADLE_FILE
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' $GRADLE_FILE
        fi
        
        KTS_FILE="android/app/build.gradle.kts"
        if [ -f "$KTS_FILE" ]; then
          sed -i 's/compileSdk =.*/compileSdk = 34/g' $KTS_FILE
          sed -i 's/targetSdk =.*/targetSdk = 34/g' $KTS_FILE
          sed -i 's/minSdk =.*/minSdk = 21/g' $KTS_FILE
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: doclima-scanner-apk
        path: build/app/outputs/flutter-apk/app-release.apk
